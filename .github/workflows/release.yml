name: Nightly release to Kidz Lounge

# Kidz Lounge's Vercel project deploys the `production` branch; the Demo
# project deploys main. Each night after the API's 2 AM release, this merges
# main into `production` with a new release commit, and Vercel deploys it.
# It waits until the API's `production` branch has everything on the API's
# main, so the site never runs ahead of the API it needs.
#
# GitHub starts scheduled runs late, often by hours (Nov 2026), so it checks
# every hour, half an hour after the API's checks, and goes ahead only
# between 2 and 5 AM in New York once the API is released. A night with
# nothing new does nothing.
# "Run workflow" on this workflow's Actions page = release now (urgent fixes;
# release the API first).
on:
  schedule:
    - cron: '37 * * * *' # hourly, half an hour after the API's
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Is it between 2 and 5 AM in New York?
        id: when
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = schedule ] && { [ "$hour" -lt 2 ] || [ "$hour" -ge 5 ]; }; then
            echo "Not between 2 and 5 AM in New York; waiting."; echo go=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo go=true >> "$GITHUB_OUTPUT"

      # Checked by comparing the API's branches, not its latest run: an
      # hourly check that skipped also counts as a successful run.
      - name: Has the API been released?
        id: api
        if: steps.when.outputs.go == 'true'
        run: |
          behind=$(curl -fsS "https://api.github.com/repos/${{ github.repository_owner }}/kidz-lounge-api/compare/production...main" | jq -r '.ahead_by' || true)
          if [ "$behind" = 0 ]; then
            echo "The API's release is done."; echo go=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo go=false >> "$GITHUB_OUTPUT"
          msg="The API's main has ${behind:-unknown} commit(s) not yet released to Kidz Lounge, so the website waits."
          if [ "${{ github.event_name }}" = schedule ]; then
            echo "$msg The next hourly check tries again."
          else
            echo "::error::$msg Run the API's release first, then this one."; exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.api.outputs.go == 'true'
        with:
          fetch-depth: 0

      # A release is a merge commit on `production`, never main's own commit:
      # Vercel skips a commit it already built (as main's preview), so
      # pushing the same commit to `production` deployed nothing (Oct 2026).
      - name: Release
        if: steps.api.outputs.go == 'true'
        run: |
          sha="${{ github.sha }}"
          # Signed as the author of the commit being released (Kieran), not
          # the Actions bot: Vercel's Hobby plan only deploys commits by the
          # account's owner, and silently skipped bot-authored ones (Oct 2026).
          git config user.name "$(git log -1 --format=%an "$sha")"
          git config user.email "$(git log -1 --format=%ae "$sha")"
          msg="Release $(git rev-parse --short "$sha") to Kidz Lounge"
          if ! git rev-parse -q --verify origin/production > /dev/null; then
            git checkout -B production "$sha"
            git commit --allow-empty -m "$msg"
          elif [ "$(git rev-parse origin/production)" = "$sha" ]; then
            # production is main's own commit (the old way): a new, empty
            # release commit on top so Vercel builds it.
            git checkout -B production origin/production
            git commit --allow-empty -m "$msg"
          elif git merge-base --is-ancestor "$sha" origin/production; then
            echo "Nothing new since the last release."; exit 0
          else
            git checkout -B production origin/production
            git merge --no-ff --no-edit -m "$msg" "$sha"
          fi
          git push origin production
          echo "Released $(git rev-parse --short "$sha") as $(git rev-parse --short HEAD); Vercel deploys it to Kidz Lounge now."
